<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f9f6f2; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #5a5a5a; }
        #uploadBtn { background: #d4af37; color: white; border: none; padding: 15px 30px; border-radius: 5px; font-size: 18px; cursor: pointer; }
        #status { margin-top: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Share the Love! 📸</h1>
        <p>Upload your favorite photos from our big day.</p>
        <input type="file" id="files" accept="image/*" multiple style="display:none">
        <button id="uploadBtn" onclick="document.getElementById('files').click()">Select Photos</button>
        <div id="status"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_Xg4E_JfSDwrmIJFW6eknxTRgd1Sy_Wml_bR-0nCpDT36kNhPJhwUU9WFQXnkzlF4Iw/exec"; // Paste your Web App URL here

        document.getElementById('files').addEventListener('change', async (e) => {
            const status = document.getElementById('status');
            const files = e.target.files;
            
            for (let file of files) {
                status.innerText = `Uploading ${file.name}...`;
                
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            base64: base64,
                            type: file.type,
                            name: file.name
                        })
                    });
                    const result = await response.json();
                    if(result.status === 'success') {
                        status.innerText = "Upload Complete! Thank you ❤️";
                    } else {
                        status.innerText = "Error: " + result.message;
                    }
                };
            }
        });
    </script>
</body>
</html>
