<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Gallery</title>
    <style>
        :root { --gold: #d4af37; --cream: #f9f6f2; --text: #4a4a4a; }
        body { 
            font-family: 'Segoe UI', serif; 
            background: var(--cream); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 85%; 
            max-width: 400px; 
        }
        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; color: #333; }
        p { margin-bottom: 2rem; font-style: italic; opacity: 0.8; }
        
        #uploadBtn { 
            background: var(--gold); 
            color: white; 
            border: none; 
            padding: 1.2rem 2rem; 
            border-radius: 50px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: 100%;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        #uploadBtn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        
        #statusBox { margin-top: 1.5rem; font-size: 0.95rem; font-weight: 500; }
        
        .progress-container { 
            width: 100%; 
            background-color: #eee; 
            border-radius: 10px; 
            margin-top: 15px; 
            display: none; 
            overflow: hidden;
        }
        .progress-bar { 
            width: 0%; 
            height: 12px; 
            background: linear-gradient(90deg, #d4af37, #f2d98a); 
            transition: width 0.4s ease; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Zack & Lexy's Wedding 📸</h1>
    <p>Share your favorite moments with us</p>
    
    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    <button id="uploadBtn">Choose Photos to Upload</button>

    <div class="progress-container" id="progressWrapper">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="statusBox">Ready to share</div>
</div>

<script>
    /** * CONFIGURATION
     * 1. Paste your Google Web App URL between the quotes below
     */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_Xg4E_JfSDwrmIJFW6eknxTRgd1Sy_Wml_bR-0nCpDT36kNhPJhwUU9WFQXnkzlF4Iw/exec"; 
    
    // Resize settings (makes it 10x faster)
    const MAX_WIDTH = 1920; 
    const QUALITY = 0.75;   

    const btn = document.getElementById('uploadBtn');
    const input = document.getElementById('fileInput');
    const status = document.getElementById('statusBox');
    const progressWrapper = document.getElementById('progressWrapper');
    const progressBar = document.getElementById('progressBar');

    btn.addEventListener('click', () => input.click());

    input.addEventListener('change', async (e) => {
        const files = e.target.files;
        if (files.length === 0) return;

        // Reset UI for new upload
        btn.disabled = true;
        btn.innerText = "Processing...";
        progressWrapper.style.display = 'block';
        progressBar.style.width = "0%";
        
        let uploadedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.innerText = `Optimizing: ${file.name}...`;
            
            try {
                // 1. Resize the image locally on the phone
                const base64Data = await processAndResize(file);

                // Add a small random delay (0 to 2 seconds) to spread out the server load
                await new Promise(resolve => setTimeout(resolve, Math.random() * 2000));
                
                status.innerText = `Uploading: ${i + 1} of ${files.length}...`;
                
                // 2. Send the data to your Google Script
                await sendToGoogle(base64Data, file.name);
                
                // 3. Update Progress
                uploadedCount++;
                const percent = (uploadedCount / files.length) * 100;
                progressBar.style.width = percent + "%";
            } catch (err) {
                console.error("Upload error:", err);
                status.innerText = "Error uploading " + file.name;
            }
        }

        status.innerText = `Done! Successfully sent ${uploadedCount} photos. ❤️`;
        btn.disabled = false;
        btn.innerText = "Upload More";
        input.value = ""; 
    });

    /**
     * Shrinks the image and converts to JPEG string
     */
    async function processAndResize(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
                    resolve(dataUrl.split(',')[1]); 
                };
            };
        });
    }

    /**
     * Sends the data using 'no-cors' to prevent Google Script security blocks
     */
    async function sendToGoogle(base64, fileName) {
        // We use mode: 'no-cors' because Google Scripts don't send back 
        // a 'success' header that browsers like. The upload still works.
        return fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                base64: base64,
                type: 'image/jpeg',
                name: fileName.split('.')[0] + ".jpg"
            })
        });
    }
</script>

</body>
</html>
