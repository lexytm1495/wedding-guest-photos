<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photo Upload</title>
    <style>
        :root { --gold: #d4af37; --cream: #f9f6f2; --text: #4a4a4a; }

        .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; width: 90%; max-width: 400px; }
        h1 { font-family: serif; font-size: 2rem; margin-bottom: 0.5rem; }
        p { margin-bottom: 2rem; font-style: italic; opacity: 0.8; }
        #uploadBtn { background: var(--gold); color: white; border: none; padding: 1rem 2rem; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s; width: 100%; }
        #uploadBtn:active { transform: scale(0.98); }
        #statusBox { margin-top: 1.5rem; font-size: 0.9rem; min-height: 1.2rem; }
        .progress-container { width: 100%; background-color: #eee; border-radius: 10px; margin-top: 10px; display: none; }
        .progress-bar { width: 0%; height: 10px; background-color: var(--gold); border-radius: 10px; transition: width 0.3s; }
    </style>
</head>
